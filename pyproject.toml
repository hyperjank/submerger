[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "submerger"
version = "0.1.0"
description = "MVP mpv-based Qt video player with dual custom subtitles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "python-mpv>=1.0.6",
]

[project.scripts]
submerger = "submerger.main:main"
submerger-align = "submerger.align_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
